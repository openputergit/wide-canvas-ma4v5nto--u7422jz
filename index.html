<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Security Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
        }
        .scan-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <div class="flex items-center justify-center mb-4">
                <i class="bi bi-shield-check text-5xl text-blue-600"></i>
            </div>
            <h1 class="text-4xl font-bold text-gray-800 mb-2">CyberGuard</h1>
            <p class="text-gray-600">Advanced Security Scanner & Assistant</p>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Scanner Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">Security Scanner</h2>
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                        <span class="flex items-center">
                            <i class="bi bi-bug text-red-500 mr-2"></i>
                            Ransomware Scanner
                        </span>
                        <button onclick="startScan('ransomware')" class="scan-btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                            Scan
                        </button>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                        <span class="flex items-center">
                            <i class="bi bi-shield-exclamation text-yellow-500 mr-2"></i>
                            Trojan Scanner
                        </span>
                        <button onclick="startScan('trojan')" class="scan-btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                            Scan
                        </button>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                        <span class="flex items-center">
                            <i class="bi bi-eye-slash text-purple-500 mr-2"></i>
                            Spyware Scanner
                        </span>
                        <button onclick="startScan('spyware')" class="scan-btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                            Scan
                        </button>
                    </div>
                </div>
                <div id="scanResult" class="mt-6 p-4 rounded hidden">
                    <div class="flex items-center">
                        <div class="scan-animation">
                            <i class="bi bi-arrow-repeat text-blue-500 text-xl"></i>
                        </div>
                        <span class="ml-2 text-gray-700">Scanning in progress...</span>
                    </div>
                </div>
            </div>

            <!-- Chatbot Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">Security Assistant</h2>
                <div class="chat-container bg-gray-50 rounded p-4 mb-4" id="chatMessages">
                    <div class="flex items-start mb-4">
                        <div class="flex-shrink-0 bg-blue-500 rounded-full p-2">
                            <i class="bi bi-robot text-white"></i>
                        </div>
                        <div class="ml-3 bg-blue-100 rounded-lg p-3">
                            <p class="text-gray-800">Hello! I'm your CyberGuard assistant. How can I help you with your security concerns today?</p>
                        </div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="userInput" placeholder="Type your message..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                    <button onclick="sendMessage()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg">
                        <i class="bi bi-send"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startScan(type) {
            const resultDiv = document.getElementById('scanResult');
            resultDiv.classList.remove('hidden');
            
            // Simulate API call to backend
            setTimeout(() => {
                // This is where you would normally make your API call
                fetch(`https://api.example.com/scan/${type}`)
                    .then(response => response.json())
                    .catch(error => console.error('Error:', error));
            }, 2000);
        }

        function sendMessage() {
            const userInput = document.getElementById('userInput');
            const chatMessages = document.getElementById('chatMessages');
            const message = userInput.value.trim();

            if (message) {
                // Add user message
                const userMessage = `
                    <div class="flex items-start justify-end mb-4">
                        <div class="mr-3 bg-blue-500 rounded-lg p-3">
                            <p class="text-white">${message}</p>
                        </div>
                        <div class="flex-shrink-0 bg-gray-300 rounded-full p-2">
                            <i class="bi bi-person text-white"></i>
                        </div>
                    </div>
                `;
                chatMessages.innerHTML += userMessage;

                // Simulate bot response
                setTimeout(() => {
                    const botMessage = `
                        <div class="flex items-start mb-4">
                            <div class="flex-shrink-0 bg-blue-500 rounded-full p-2">
                                <i class="bi bi-robot text-white"></i>
                            </div>
                            <div class="ml-3 bg-blue-100 rounded-lg p-3">
                                <p class="text-gray-800">I'm processing your request about "${message}". How else can I assist you?</p>
                            </div>
                        </div>
                    `;
                    chatMessages.innerHTML += botMessage;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 1000);

                userInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // Handle Enter key press
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
